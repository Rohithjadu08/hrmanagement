services:
  - type: web
    name: reckon-hr-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://hrmanagement-tau.vercel.app
      - key: FRONTEND_URL
        value: https://hrmanagement-tau.vercel.app
      - key: NODE_ENV
        value: production
